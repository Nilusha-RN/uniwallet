<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniWallet</title>
  <meta name="description"
    content="UniWallet: The smart expense tracking app for university students. Track every rupee, get weekly analysis, and savings insights." />
  <link rel="icon" type="image/png" href="logo.png.png" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ===== SPLASH SCREEN ===== */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a18;
      overflow: hidden;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-screen.hide {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-screen.gone {
      display: none;
    }

    /* Animated gradient background */
    .splash-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(90, 60, 200, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(60, 120, 255, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 20%, rgba(180, 80, 220, 0.15) 0%, transparent 60%);
      animation: splashBgPulse 4s ease-in-out infinite alternate;
    }

    @keyframes splashBgPulse {
      0% {
        opacity: 0.6;
        transform: scale(1);
      }

      100% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    /* Floating particles */
    .splash-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .splash-particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% {
        opacity: 0;
        transform: translateY(100vh) scale(0);
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-20vh) scale(1);
      }
    }

    /* Logo container */
    .splash-logo-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    /* Glow rings */
    .splash-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(124, 110, 255, 0.15);
      animation: ringPulse 2.5s ease-out infinite;
    }

    .splash-ring:nth-child(1) {
      width: 160px;
      height: 160px;
      animation-delay: 0s;
    }

    .splash-ring:nth-child(2) {
      width: 220px;
      height: 220px;
      animation-delay: 0.5s;
    }

    .splash-ring:nth-child(3) {
      width: 280px;
      height: 280px;
      animation-delay: 1s;
    }

    @keyframes ringPulse {
      0% {
        transform: scale(0.8);
        opacity: 0.6;
        border-color: rgba(124, 110, 255, 0.3);
      }

      50% {
        opacity: 0.2;
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
        border-color: rgba(255, 110, 180, 0.1);
      }
    }

    /* Logo image */
    .splash-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 24px;
      position: relative;
      z-index: 3;
      animation: logoEntry 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        logoFloat 3s ease-in-out 1s infinite alternate;
      opacity: 0;
      transform: scale(0) rotate(-10deg);
      filter: drop-shadow(0 0 30px rgba(124, 110, 255, 0.5)) drop-shadow(0 0 60px rgba(124, 110, 255, 0.2));
    }

    @keyframes logoEntry {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-10deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes logoFloat {
      0% {
        transform: translateY(0px);
      }

      100% {
        transform: translateY(-8px);
      }
    }

    /* Brand name */
    .splash-brand {
      position: relative;
      z-index: 2;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeSlideUp 0.7s ease forwards 0.5s;
    }

    .splash-brand .uni {
      background: linear-gradient(135deg, #60a5fa, #7c6eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .splash-brand .wallet {
      background: linear-gradient(135deg, #7c6eff, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Tagline with typewriter */
    .splash-tagline {
      position: relative;
      z-index: 2;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeSlideUp 0.7s ease forwards 0.9s;
    }

    .splash-tagline span {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid rgba(124, 110, 255, 0.6);
      animation: typewriter 1.8s steps(35) 1s forwards,
        blink 0.6s step-end infinite alternate;
      width: 0;
    }

    @keyframes typewriter {
      0% {
        width: 0;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Loading bar */
    .splash-loader {
      position: relative;
      z-index: 2;
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      opacity: 0;
      animation: fadeSlideUp 0.5s ease forwards 1.2s;
    }

    .splash-loader-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg, #60a5fa, #7c6eff, #c084fc, #ff6eb4);
      background-size: 200% 100%;
      animation: loaderFill 2.5s ease-in-out 1.4s forwards,
        loaderShimmer 1.5s linear infinite;
    }

    @keyframes loaderFill {
      0% {
        width: 0%;
      }

      60% {
        width: 70%;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes loaderShimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Splash version tag */
    .splash-version {
      position: absolute;
      bottom: 2rem;
      z-index: 2;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeSlideUp 0.5s ease forwards 1.5s;
    }

    /* Hide login initially for smooth reveal */
    .login-fullscreen {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
    }

    .login-fullscreen.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Splash mobile responsive */
    @media (max-width: 480px) {
      .splash-logo {
        width: 75px;
        height: 75px;
        border-radius: 18px;
      }

      .splash-ring:nth-child(1) {
        width: 120px;
        height: 120px;
      }

      .splash-ring:nth-child(2) {
        width: 165px;
        height: 165px;
      }

      .splash-ring:nth-child(3) {
        width: 210px;
        height: 210px;
      }

      .splash-brand {
        font-size: 1.8rem;
      }

      .splash-tagline {
        font-size: 0.8rem;
        margin-bottom: 2rem;
      }

      .splash-loader {
        width: 160px;
      }

      .splash-logo-wrap {
        margin-bottom: 1.5rem;
      }
    }

    @media (max-width: 380px) {
      .splash-logo {
        width: 60px;
        height: 60px;
        border-radius: 14px;
      }

      .splash-ring:nth-child(1) {
        width: 100px;
        height: 100px;
      }

      .splash-ring:nth-child(2) {
        width: 140px;
        height: 140px;
      }

      .splash-ring:nth-child(3) {
        width: 180px;
        height: 180px;
      }

      .splash-brand {
        font-size: 1.5rem;
      }

      .splash-tagline {
        font-size: 0.72rem;
        margin-bottom: 1.5rem;
      }

      .splash-loader {
        width: 140px;
      }

      .splash-logo-wrap {
        margin-bottom: 1.25rem;
      }

      .splash-version {
        bottom: 1rem;
        font-size: 0.65rem;
      }
    }

    @media (max-width: 320px) {
      .splash-logo {
        width: 50px;
        height: 50px;
        border-radius: 12px;
      }

      .splash-ring:nth-child(1) {
        width: 80px;
        height: 80px;
      }

      .splash-ring:nth-child(2) {
        width: 115px;
        height: 115px;
      }

      .splash-ring:nth-child(3) {
        width: 150px;
        height: 150px;
      }

      .splash-brand {
        font-size: 1.3rem;
      }

      .splash-tagline {
        font-size: 0.65rem;
      }

      .splash-loader {
        width: 120px;
        height: 3px;
      }

      .splash-logo-wrap {
        margin-bottom: 1rem;
      }
    }
  </style>
</head>

<body class="login-page">

  <!-- ===== SPLASH SCREEN ===== -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-bg"></div>

    <!-- Floating particles (generated by JS) -->
    <div class="splash-particles" id="splashParticles"></div>

    <div class="splash-logo-wrap">
      <div class="splash-ring"></div>
      <div class="splash-ring"></div>
      <div class="splash-ring"></div>
      <img src="logo.png.png" alt="UniWallet Logo" class="splash-logo" />
    </div>

    <div class="splash-brand">
      <span class="uni">Uni</span><span class="wallet">Wallet</span>
    </div>

    <div class="splash-tagline">
      <span>Smart expense tracking for students</span>
    </div>

    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>

  </div>

  <!-- ===== LOGIN PAGE (hidden behind splash) ===== -->
  <div class="login-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-container" id="loginContainer">
    <div class="login-card glass">

      <div class="login-header">
        <div class="logo-icon">
          <img src="logo.png.png" alt="UniWallet Logo"
            style="width:48px;height:48px;object-fit:contain;border-radius:8px;" />
        </div>
        <h1>UniWallet</h1>
        <p>Smart expense tracking for university students</p>
      </div>

      <div class="login-features">
        <div class="feature-item">
          <i class="fas fa-chart-pie"></i>
          <span>Track every rupee</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-calendar-week"></i>
          <span>Weekly analysis</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-piggy-bank"></i>
          <span>Savings insights</span>
        </div>
      </div>

      <button id="googleSignInBtn" class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
        <span>Continue with Google</span>
      </button>

      <p class="login-note">Your data is private and secure. Only you can see your expenses.</p>

    </div>
  </div>

  <!-- Splash screen logic -->
  <script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    (function () {
      const splash = document.getElementById('splashScreen');
      const loginContainer = document.getElementById('loginContainer');

      // Check auth state FIRST — if already signed in, skip splash entirely
      onAuthStateChanged(auth, function (user) {
        if (user) {
          // Already signed in — redirect immediately, no splash needed
          window.location.href = "dashboard.html";
          return;
        }

        // Not signed in — show the full splash animation, then reveal login
        startSplashAnimation();
      });

      function startSplashAnimation() {
        // Generate floating particles — fewer on mobile for performance
        const particlesContainer = document.getElementById('splashParticles');
        const colors = ['rgba(124,110,255,0.4)', 'rgba(96,165,250,0.3)', 'rgba(192,132,252,0.3)', 'rgba(255,110,180,0.25)'];
        const isMobile = window.innerWidth <= 480;
        const particleCount = isMobile ? 15 : 30;
        for (let i = 0; i < particleCount; i++) {
          const p = document.createElement('div');
          p.classList.add('splash-particle');
          const size = Math.random() * (isMobile ? 4 : 6) + 2;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.left = Math.random() * 100 + '%';
          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          p.style.animationDuration = (Math.random() * 4 + 4) + 's';
          p.style.animationDelay = (Math.random() * 3) + 's';
          p.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + p.style.background;
          particlesContainer.appendChild(p);
        }

        // Dismiss splash after animations complete
        setTimeout(function () {
          splash.classList.add('hide');
          loginContainer.classList.add('visible');
          setTimeout(function () {
            splash.classList.add('gone');
          }, 800);
        }, 3800);
      }
    })();
  </script>

  <script type="module" src="app.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
